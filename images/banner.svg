<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f1b3d"/>
      <stop offset="55%" stop-color="#14304f"/>
      <stop offset="100%" stop-color="#0e4d5c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="100%" stop-color="#63b3ed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
  </g>

  <!-- risk trend line motif -->
  <polyline points="820,190 880,150 930,170 985,110 1040,130 1090,75 1150,95"
    fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
  <g fill="#4fd1c5">
    <circle cx="880" cy="150" r="4"/>
    <circle cx="985" cy="110" r="4"/>
    <circle cx="1090" cy="75" r="4"/>
  </g>

  <!-- bar chart motif -->
  <g fill="#ffffff" fill-opacity="0.12">
    <rect x="820" y="200" width="18" height="30"/>
    <rect x="850" y="185" width="18" height="45"/>
    <rect x="880" y="160" width="18" height="70"/>
    <rect x="910" y="195" width="18" height="35"/>
  </g>

  <text x="60" y="100" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#ffffff">
    Delinquency Prediction &amp; Ethical Collections
  </text>
  <text x="60" y="140" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#9fd8e0">
    Explainable, Fairness-Aware Machine Learning for Financial Risk Analytics
  </text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#c9e7ea">
    <rect x="60" y="170" width="120" height="30" rx="15" fill="#ffffff" fill-opacity="0.10"/>
    <text x="78" y="190">Python</text>

    <rect x="195" y="170" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.10"/>
    <text x="213" y="190">scikit-learn</text>

    <rect x="360" y="170" width="130" height="30" rx="15" fill="#ffffff" fill-opacity="0.10"/>
    <text x="378" y="190">SHAP</text>

    <rect x="505" y="170" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.10"/>
    <text x="523" y="190">Fairlearn</text>
  </g>
</svg>
